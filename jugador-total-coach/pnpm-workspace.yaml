packages:
  - apps/*
  - packages/*

autoInstallPeers: false
strictPeerDependencies: true
engineStrict: true
saveExact: true
ignoreScripts: true
managePackageManagerVersions: false
updateNotifier: false
storeDir: .cache/pnpm/store
cacheDir: .cache/pnpm/cache
stateDir: .cache/pnpm/state
enableGlobalVirtualStore: false

# Fase 05: transitivas revisadas, sin resolver versiones futuras implícitamente.
overrides:
  '@react-three/rapier>three-stdlib': 2.36.1
  '@react-three/rapier>suspend-react': 0.1.3
  'three-stdlib>fflate': 0.6.10
  'three-stdlib>draco3d': 1.5.7
  'three-stdlib>potpack': 1.0.2
  'three-stdlib>@types/webxr': 0.5.24
  'three-stdlib>@types/draco3d': 1.4.10
  'three-stdlib>@types/offscreencanvas': 2019.7.3
